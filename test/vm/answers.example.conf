# Answer file for the automated VM run. Test values only - never reuse these.
DISK=/dev/vda
HOSTNAME=archwright-vm
USERNAME=test
USER_PASSWORD=testpassword
LUKS_PASSPHRASE=testpassphrase
LOCALE=en_US.UTF-8
TIMEZONE=UTC
KEYMAP=us
# Opt-in application groups, comma separated. See manifest/extras.packages for
# the available names. The test picks a small group so the gate proves the
# selection works without downloading an office suite.
EXTRAS=containers
# Skip the login prompt and start the session directly. A supported option for
# single-user machines; the test harness needs it because it drives the guest
# over a serial console and cannot type into tuigreet on VT1.
AUTOLOGIN=1
# Test-only: adds console=ttyS0,115200 to the UKI cmdline so the harness
# can drive the installed system over the serial port.
SERIAL_CONSOLE=1

# Colour theme. Omitted here on purpose, so the gate exercises the documented
# default (mocha) rather than an explicit value. Run `archwright theme list` on
# the installed system to see the rest.
# THEME=tokyonight
