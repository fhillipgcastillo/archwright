# Remove any sudo window left over from before this boot.
#
# WHY THIS FILE EXISTS
#
# `archwright sudo-window` grants passwordless sudo by writing a drop-in to
# /etc/sudoers.d and scheduling a systemd timer to delete it. The drop-in is
# persistent; the timer is transient, and transient units live in /run, which
# does not survive a reboot.
#
# So a machine that reboots inside the window - a crash, a power cut, or just
# someone rebooting - came back with the grant still in place and nothing left
# to remove it. Permanent passwordless root, silently, from a feature whose
# entire purpose is not to do that.
#
# The '!' means this line runs only at boot (systemd-tmpfiles --boot), never
# from the periodic clean timer, so it can never delete a window that is
# legitimately open in the current session.
r! /etc/sudoers.d/99-archwright-sudo-window
