# Archwright shell layer bindings and autostart.
#
# This file is the ONLY Hyprland configuration that names a shell component.
# hyprland.conf sources it and otherwise knows nothing about waybar, fuzzel or
# hyprlock - which is what makes the shell swappable (decision D3). Replacing
# the furniture layer means replacing this file and the systemd target it
# starts, and nothing else.

# Start the whole furniture layer as one unit.
exec-once = systemctl --user start archwright-shell.target

# GTK applications take their light/dark and accent over D-Bus, not from a
# file, so there is nothing the installer can write from a chroot that makes
# Nautilus match the terminal beside it. This applies it once the session bus
# exists. Idempotent; runs on every login.
exec-once = archwright-apply-gtk-theme

$mod = SUPER

# Launcher and lock are ON DEMAND - deliberately not services.
bind = $mod, Space, exec, fuzzel
bind = $mod CTRL, L, exec, loginctl lock-session

# Notifications
bind = $mod, comma, exec, makoctl dismiss
bind = $mod SHIFT, comma, exec, makoctl dismiss --all

# The default agent, in a terminal of its own. Which agent that is comes from
# ~/.local/state/archwright/default-agent - change it with
# `archwright default agent <name>` rather than by editing this line, so the
# keybind and the `a` shortcut can never disagree.
#
# Launched through `uwsm app` like everything else here, so it gets its own
# systemd scope instead of inheriting the compositor's.
bind = $mod SHIFT CTRL, A, exec, uwsm app -- foot -e archwright agent
