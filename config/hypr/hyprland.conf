# Archwright default Hyprland configuration.
#
# This file is seeded into ~/.config/hypr/ on first install and is then YOURS -
# updates never overwrite it. The package-owned original lives at
# /usr/share/archwright/default-config/hypr/hyprland.conf if you want to
# compare against it or start over.

# Take whatever the display offers. Real hardware and VMs both work.
monitor = , preferred, auto, 1

# --- Session environment -----------------------------------------------------
# Reproduced from docs/research-extract.md section 1. These are the small facts
# that otherwise take weeks to rediscover, not preferences.
#
# XDG_CURRENT_DESKTOP is what makes screen sharing work in Meet and Discord.
# MOZ_ENABLE_WAYLAND matters here because Archwright defaults to Firefox.
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,gtk3
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

xwayland {
    # Without this, X11 clients are blurry on scaled displays.
    force_zero_scaling = true
}

# --- Autostart ---------------------------------------------------------------
# The import-environment / dbus-update-activation-environment pair MUST run
# before any session service. It is the documented fix for slow application
# launches: systemd user services and D-Bus activation do not inherit the
# session environment on their own. See research-extract section 2.
exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all

# --- Look and feel -----------------------------------------------------------
# Revised in the theming milestone (D22). The earlier rule was "square corners,
# no blur, no shadows, decided not configured" - a deliberately plain default on
# the grounds that plain is safe.
#
# It is safe, and it is also indistinguishable from an afternoon's work with the
# Arch wiki. A system worth installing over vanilla Arch has to look like
# something on first boot. So: rounded corners, a soft shadow, and blur on the
# LAYER SURFACES only - the bar, the launcher, notifications.
#
# That last distinction is the whole cost argument. Blurring windows means
# resampling the full framebuffer every frame and shows up immediately on
# battery and on integrated graphics. Blurring the three small always-on-top
# surfaces costs almost nothing and is where the effect is actually visible.
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 10

    shadow {
        enabled = true
        range = 14
        render_power = 3
        offset = 0 2
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        # Windows are NOT blurred - see above. These three are.
        popups = true
    }
}

# Blur the shell layer, not the desktop.
#
# THE SYNTAX HERE IS NOT THE ONE MOST EXAMPLES ONLINE SHOW.
#
# Hyprland 0.53 replaced the rule grammar. The old `layerrule = blur, waybar`
# is rejected by 0.56 with "invalid field blur: missing a value" - once per
# line, painted over the desktop, because Hyprland does not refuse to start on
# a bad option. These lines were removed for a while rather than guessed at,
# and the form below is the one the installed compositor was asked to parse and
# accepted, not one copied from a search result.
#
# Only the layer surfaces. Blurring windows resamples the full framebuffer
# every frame and shows up immediately on battery and integrated graphics;
# blurring three small always-on-top surfaces costs almost nothing and is where
# the effect is actually visible.
layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace launcher
layerrule = blur on, match:namespace notifications

# The old `ignorezero` companion rule is NOT here. Its 0.53+ spelling was never
# put to the compositor, and writing an unverified line into a config is the
# exact mistake the note above exists because of. Blur works without it; it is
# an optimisation for fully transparent regions, and it can be added once it
# has been probed like the lines above were.

# Motion, kept short. Long animations look impressive in a video and get in the
# way every single time you switch a window.
animations {
    enabled = true
    bezier = snap, 0.2, 0.9, 0.2, 1.0
    animation = windows, 1, 3, snap, popin 92%
    animation = windowsOut, 1, 3, snap, popin 92%
    animation = border, 1, 6, snap
    animation = fade, 1, 3, snap
    animation = workspaces, 1, 4, snap, slide
}

dwindle {
    preserve_split = true
    force_split = 2
}

animations {
    enabled = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

# --- Input -------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
}

# --- Keybinds ----------------------------------------------------------------
# Super is the centre of everything.
$mod = SUPER

# The shell layer lives behind its own file so the compositor config never names
# a shell component. See config/hypr/shell.conf and decision D3.
source = ~/.config/hypr/shell.conf

bind = $mod, Return, exec, foot
bind = $mod, Q, killactive,
bind = $mod, W, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod, F, fullscreen, 0
bind = $mod, T, togglefloating,

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- Colours -----------------------------------------------------------------
# Sourced LAST so the palette wins over anything above it. This file is
# generated by `archwright theme` and is the only part of the look that a theme
# change rewrites; everything else here is yours.
source = ~/.config/hypr/colors.conf
